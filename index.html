<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarginNote</title>
  <style>
    :root { --ink:#17211c; --paper:#fbfaf5; --accent:#4e8b62; --line:#dce2d8; --soft:#edf4ed; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:ui-serif, Georgia, "Hiragino Mincho ProN", serif; color:var(--ink); background:var(--paper); }
    header { display:flex; justify-content:space-between; align-items:center; padding:22px max(5vw,28px); border-bottom:1px solid var(--line); }
    .brand { font-size:1.35rem; letter-spacing:.04em; font-weight:700; } .brand span { color:var(--accent); }
    .status { color:#647068; font-size:.88rem; }
    main { width:min(1000px,90vw); margin:clamp(32px,7vw,82px) auto; }
    .eyebrow { color:var(--accent); letter-spacing:.16em; font-size:.75rem; font-weight:700; }
    h1 { font-size:clamp(2.1rem,5vw,4.2rem); max-width:700px; margin:.3em 0 .18em; line-height:1.15; }
    .intro { color:#526057; max-width:610px; line-height:1.8; margin-bottom:40px; }
    .editor { display:grid; grid-template-columns:1fr 260px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:white; box-shadow:0 16px 50px #233a2610; }
    .page { padding:32px; min-height:430px; }
    textarea { resize:none; width:100%; height:280px; border:0; outline:0; color:var(--ink); font:1.04rem/1.9 ui-serif, Georgia, serif; background:transparent; }
    aside { padding:24px; background:var(--soft); border-left:1px solid var(--line); }
    aside h2 { font-size:.85rem; letter-spacing:.1em; margin:0 0 15px; } .hint { font: .87rem/1.7 ui-sans-serif, system-ui, sans-serif; color:#506056; }
    button { border:0; border-radius:7px; padding:11px 15px; background:var(--accent); color:white; cursor:pointer; font-weight:700; } button:hover { background:#3e7350; }
    .notes { margin-top:18px; display:grid; gap:8px; } .note { background:white; padding:11px; border-radius:7px; font:.88rem/1.5 ui-sans-serif,system-ui,sans-serif; }
    .actions { display:flex; gap:9px; align-items:center; font-family:ui-sans-serif,system-ui,sans-serif; font-size:.84rem; }
    @media (max-width:720px) { .editor { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } }
  </style>
</head>
<body>
  <header><div class="brand">Margin<span>Note</span></div><div class="status" id="status">ローカルに保存されます</div></header>
  <main>
    <div class="eyebrow">THINK IN THE MARGIN</div>
    <h1>余白から、考えを育てる。</h1>
    <p class="intro">読書中の断片や、ふと浮かんだアイデアを気軽に書き留めるための、静かなノートです。</p>
    <section class="editor">
      <div class="page">
        <textarea id="editor" aria-label="ノート" placeholder="ここに書き始めてください。&#10;&#10;大切なことは、まず余白に置いてみること。"></textarea>
        <div class="actions"><button id="save">保存する</button><span id="count">0 文字</span></div>
      </div>
      <aside>
        <h2>余白のヒント</h2>
        <p class="hint">完璧な文章でなくて大丈夫。問い、引用、次に試したいことを書き残しましょう。</p>
        <div class="notes">
          <div class="note">「これはなぜ心に残った？」</div>
          <div class="note">「別の場面ではどう使える？」</div>
          <div class="note">「明日、何を一つ試す？」</div>
        </div>
      </aside>
    </section>
  </main>
  <script>
    const editor=document.querySelector('#editor'), count=document.querySelector('#count'), status=document.querySelector('#status');
    editor.value=localStorage.getItem('marginnote')||'';
    const update=()=>count.textContent=editor.value.length+' 文字';
    update(); editor.addEventListener('input',update);
    document.querySelector('#save').addEventListener('click',()=>{ localStorage.setItem('marginnote',editor.value); status.textContent='保存しました'; setTimeout(()=>status.textContent='ローカルに保存されます',1800); });
  </script>
</body>
</html>
