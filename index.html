<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarginNote — 多言語で読む、ことばを育てる</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Serif+JP:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
:root{--ink:#1d2820;--muted:#68766d;--paper:#f8f7f0;--card:#fffefa;--green:#286044;--deep:#183727;--lime:#d9ed99;--yellow:#fff0a7;--line:#e3e7dc;--peach:#f7c37b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans","Hiragino Sans",sans-serif}button{font:inherit;border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--deep);color:#eaf1e9;padding:25px 17px;position:relative}.logo{font-size:22px;font-weight:700;letter-spacing:-1px;padding:0 10px}.logo b{color:var(--lime)}.tagline{font:11px/1.6 "Noto Serif JP",serif;color:#acc2af;padding:4px 10px}.nav{margin-top:35px;display:grid;gap:4px}.nav button{padding:11px;color:#c6d6c7;background:transparent;text-align:left;border-radius:8px;font-size:13px}.nav button.active,.nav button:hover{background:#355443;color:white}.side-label{margin:33px 10px 9px;color:#a9b9aa;font:10px "DM Mono";letter-spacing:.1em}.policy{padding:13px;background:#294837;border-radius:9px;color:#c5d7c6;font:11px/1.65 "Noto Serif JP",serif}.policy b{color:var(--lime)}.profile{position:absolute;bottom:26px;left:27px;font-size:12px;color:#c7d6c8}.top{height:74px;background:#fcfbf7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px}.crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}.pill{padding:9px 12px;background:#edf1e8;border-radius:8px;font-size:12px;color:#405247;font-weight:600}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--peach);font-size:12px;font-weight:700}.page{width:min(1120px,calc(100% - 66px));margin:39px auto}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.eyebrow{font:10px "DM Mono";letter-spacing:.12em;color:var(--green)}h1{font:600 29px/1.45 "Noto Serif JP",serif;margin:7px 0 0;letter-spacing:-1px}.count{font-size:12px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{padding:8px 13px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--muted);font-size:12px}.filter.active{background:var(--green);border-color:var(--green);color:white}.books{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.book{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px;min-height:208px;display:flex;flex-direction:column;transition:.15s}.book:hover{transform:translateY(-3px);box-shadow:0 12px 25px #18372710}.cover{width:39px;height:39px;display:grid;place-items:center;border-radius:9px;background:var(--lime);font-size:19px}.lang{font:10px "DM Mono";color:var(--green);margin:18px 0 7px;letter-spacing:.06em}.book h3{font:600 18px/1.5 "Noto Serif JP",serif;margin:0}.book p{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0}.open{margin-top:auto;align-self:flex-start;background:var(--green);color:white;border-radius:7px;padding:9px 11px;font-size:12px;font-weight:700}.reader{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:25px}.reader-main{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:40px 10%;box-shadow:0 8px 25px #18372708}.reader-meta{display:flex;justify-content:space-between;font:10px "DM Mono";color:#7f8a80;margin-bottom:22px}.reader-main h2{font:600 27px/1.55 "Noto Serif JP",serif;margin:0 0 27px}.reader-main p{font:17px/2.25 Georgia,"Noto Serif JP",serif;margin:0 0 20px;color:#343d35}.word{display:inline;background:transparent;padding:0;color:inherit;font:inherit;border-radius:3px}.word:hover{background:transparent;color:inherit}.memo-mode .word{pointer-events:none}.memo-mode .word:hover{background:transparent}.annot{position:relative;background:linear-gradient(transparent 56%,var(--lime) 56%);cursor:pointer}.annot.has-note:before{content:attr(data-note);position:absolute;bottom:calc(100% + 9px);left:0;z-index:3;width:max-content;max-width:230px;padding:7px 10px;border-radius:8px;background:#2d503c;color:#f4f8ea;font:12px/1.6 "Noto Serif JP",serif;box-shadow:0 7px 18px #1630213b}.annot.has-note:after{content:"";position:absolute;bottom:calc(100% + 3px);left:12px;border:6px solid transparent;border-top-color:#2d503c}.study{position:sticky;top:20px}.definition,.cardbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:13px}.definition .placeholder{font:12px/1.7 "Noto Serif JP",serif;color:var(--muted)}.definition .wordtitle{font:600 25px Georgia,serif}.definition .language{font:10px "DM Mono";color:var(--green);margin:5px 0 13px}.meaning{font:13px/1.75 "Noto Serif JP",serif}.addword{margin-top:13px;padding:9px 11px;border-radius:7px;background:var(--green);color:white;font-size:12px;font-weight:700}.cardbox h3{font-size:13px;margin:0 0 7px}.cardbox p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 10px}.cards-btn{background:#eef3e9;color:#345643;border-radius:7px;padding:8px 10px;font-size:12px;font-weight:700}.hint{margin-top:15px;display:flex;gap:9px;font-size:11px;line-height:1.6;color:var(--muted)}.hint i{background:var(--lime);width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#264b35;font-style:normal;font-weight:bold}.selection{position:fixed;z-index:5;display:none;background:var(--deep);color:#fff;border-radius:8px;box-shadow:0 9px 20px #18372740}.selection button{background:transparent;color:white;padding:8px 10px;font-size:12px;font-weight:700}.modal{position:fixed;z-index:10;display:none;inset:0;place-items:center;background:#18372755;padding:18px}.modal.show{display:grid}.dialog{width:min(460px,100%);background:white;border-radius:15px;padding:24px;box-shadow:0 18px 50px #18372750}.dialog h3{font:600 18px "Noto Serif JP",serif;margin:15px 0}.selected{background:#f0f5c8;border-radius:6px;padding:9px;font:13px/1.6 "Noto Serif JP",serif}.dialog textarea{width:100%;height:108px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical;font:13px/1.6 "Noto Serif JP",serif}.dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.cancel{background:#edf0ea;border-radius:7px;padding:9px 12px}.save{background:var(--green);color:white;border-radius:7px;padding:9px 13px;font-weight:700}.flash{min-height:250px;display:grid;place-items:center;text-align:center}.flash .front{font:600 32px Georgia,serif}.flash .back{font:15px/1.8 "Noto Serif JP",serif;margin-top:20px;display:none}.flash.show .back{display:block}.review-actions{display:flex;gap:8px;justify-content:center;margin-top:22px}.again{padding:9px 15px;border-radius:7px;background:#fbe1d0;color:#80431e}.good{padding:9px 15px;border-radius:7px;background:var(--green);color:white}.backlink{margin-bottom:18px;padding:0;background:transparent;color:var(--green);font-size:13px;font-weight:700}@media(max-width:880px){.app{grid-template-columns:1fr}.side{display:none}.page{width:calc(100% - 32px);margin:27px auto}.top{padding:0 18px}.books{grid-template-columns:1fr}.reader{grid-template-columns:1fr}.study{position:static}.reader-main{padding:30px 8%}.reader-main p{font-size:16px}}</style></head>
<body><div class="app"><aside class="side"><div class="logo">Margin<b>Note</b></div><div class="tagline">読む。調べる。余白に残す。</div><nav class="nav"><button class="active" id="libraryNav">▣　教材ライブラリ</button><button id="cardsNav">▤　わたしの単語帳</button></nav><div class="side-label">COPYRIGHT SAFE</div><div class="policy"><b>収録テキストについて</b><br>パブリックドメイン童話に着想を得た、オリジナル学習用テキストだけを収録しています。</div><div class="profile">●　Haruka's study space</div></aside><main><header class="top"><div class="crumb" id="crumb">ライブラリ　/　多言語で読む</div><div class="top-actions"><button class="pill" id="modeToggle">✎ メモモード</button><button class="pill" id="cardsTop">単語帳 <span id="cardCount">0</span></button><div class="avatar">H</div></div></header><div class="page" id="view"></div></main></div><div class="selection" id="selection"><button id="noteButton">＋ この箇所にメモ</button></div><div class="modal" id="modal"><div class="dialog"><div class="selected" id="picked"></div><h3>文章の上にメモを置く</h3><textarea id="noteText" placeholder="気づきや自分の訳を書きましょう"></textarea><footer><button class="cancel" id="cancel">キャンセル</button><button class="save" id="saveNote">保存する</button></footer></div></div>
<script>
const texts=[
{id:'jp-moon',lang:'日本語',icon:'◐',title:'月の灯りを追いかけて',desc:'オリジナル童話 · 読了 6分',body:['むかし、小さな村に、夜になると窓辺で月を眺めるユイという子どもがいました。ユイは、月の光がどこから来るのか、ずっと知りたいと思っていました。','ある秋の晩、ユイは小さなランタンを持って、村はずれの丘へ向かいました。道には落ち葉が重なり、足もとでさらさらと音を立てます。遠くでは、川が月の光を細く映していました。','丘の上で、ユイは一羽の白いふくろうに出会いました。ふくろうは静かな声で言いました。「月の灯りは、遠くへ行くためのものではないよ。立ち止まって、ここにあるものを見るための灯りなんだ。」','ユイは村を見下ろしました。家の屋根、眠っている畑、遅くまで働くパン屋の窓。いつも見ていた景色なのに、その夜は初めて見るように美しく感じられました。','帰り道、ユイはランタンの火を消しました。月の灯りだけで歩くことができたからです。それからユイは、何かに迷ったとき、急いで答えを探す前に、少しだけ立ち止まるようになりました。'],dict:{}},
{id:'jp-seed',lang:'日本語',icon:'✿',title:'春を待つ種',desc:'オリジナル童話 · 読了 5分',body:['雪がまだ庭に残るころ、ミナは祖母から小さな種を一つ受け取りました。「これは何の種？」とミナが尋ねると、祖母は笑って答えました。「春になってからのお楽しみ。」','ミナは毎朝、土をのぞきこみました。でも、次の日も、その次の日も、土は静かなままでした。待つことが苦手なミナは、種を掘り出して確かめたくなりました。','けれど祖母は言いました。「見えないところでも、種は仕事をしているのよ。」ミナは水を少しだけあげ、窓のそばで本を読むことにしました。','暖かい雨が降った朝、土から緑の小さな芽が顔を出しました。ミナは驚いて、庭へ走りました。その芽は日ごとに伸び、やがて青い花を咲かせました。','ミナは花のそばに小さな札を立てました。そこには「見えない時間も、大切な時間」と書いてありました。'],dict:{}},
{id:'en-hare',lang:'ENGLISH',icon:'☘',title:'The Tortoise and the Hare',desc:'Public-domain fable adaptation · 7 min read',body:['A hare laughed when he saw a tortoise walking beside the old forest road. “You are so slow,” he said. “By the time you reach the hill, the sun will be asleep.” The tortoise did not become angry. She looked at the bright morning and smiled.','“Then let us have a race,” said the tortoise. The animals of the forest gathered near a tall oak tree. A fox marked the finish line beside a clear stream, and everyone waited for the signal.','The hare ran like the wind. Before noon, he could no longer see the tortoise behind him. He stopped near a field of soft grass. “I have plenty of time,” he thought. “A short rest will make the race more enjoyable.”','While the hare slept, the tortoise continued. Her steps were small, but they were steady. She passed the field, crossed a wooden bridge, and followed the path beside the stream. She did not look back even once.','Late in the afternoon, the hare woke suddenly. The sun was low, and the air had turned cool. He ran as fast as he could, but the animals were already cheering. The tortoise had reached the finish line.','The hare felt embarrassed, but the tortoise only said, “Speed is useful, but a calm heart can travel far.” From that day, the hare still ran quickly, but he learned not to laugh at a slow beginning.'],dict:{hare:'野うさぎ',tortoise:'カメ',forest:'森',road:'道',slow:'遅い',race:'競走',gathered:'集まった',finish:'ゴール',stream:'小川',plenty:'たくさん',steady:'着実な',bridge:'橋',reached:'到着した',embarrassed:'恥ずかしい',useful:'役に立つ'}},
{id:'en-lantern',lang:'ENGLISH',icon:'✦',title:'The Lantern in the Window',desc:'Original learning tale · 6 min read',body:['In a village beside the sea, an old woman named Mara placed a small lantern in her window every evening. The light was not very strong, but it could be seen from the narrow road near the harbour.','One winter night, a young fisherman was returning home when thick fog covered the water. He could not see the boats, the shore, or even his own hands. He was afraid that he would walk in the wrong direction.','Then, far away, he noticed a warm yellow light. It appeared, disappeared, and appeared again as the fog moved. The fisherman followed the light slowly, listening for the sound of the waves.','At last he reached Mara’s house. She opened the door before he could knock. “Come in,” she said. “The lantern is for anyone who needs to find a safe way home.”','The next morning, the fisherman thanked Mara and offered her a basket of fresh fish. She accepted one small fish and asked him to share the rest with his neighbours. After that night, other houses began to place lights in their windows too.','Years later, visitors called the village the harbour of lanterns. Mara always said that one small light was not a miracle. It was simply an invitation to help another person take the next step.'],dict:{village:'村',sea:'海',lantern:'ランタン',window:'窓',harbour:'港',fisherman:'漁師',fog:'霧',shore:'岸',direction:'方向',followed:'ついて行った',waves:'波',safe:'安全な',neighbours:'近所の人々',invitation:'招待・きっかけ'}}];let current=null,range=null,memoMode=true;const view=document.querySelector('#view'),crumb=document.querySelector('#crumb'),selection=document.querySelector('#selection'),modal=document.querySelector('#modal'),noteText=document.querySelector('#noteText'),picked=document.querySelector('#picked');
const cards=()=>JSON.parse(localStorage.getItem('mn-cards')||'[]');function setCards(a){localStorage.setItem('mn-cards',JSON.stringify(a));document.querySelectorAll('#cardCount').forEach(x=>x.textContent=a.length)}
function library(){current=null;crumb.textContent='ライブラリ　/　多言語で読む';view.innerHTML='<div class="heading"><div><div class="eyebrow">COPYRIGHT-SAFE LANGUAGE LIBRARY</div><h1>童話を読みながら、ことばを自分のものに。</h1></div><div class="count">4つのオリジナル教材</div></div><div class="filters"><button class="filter active">すべて</button><button class="filter">English</button><button class="filter">Español</button><button class="filter">Français</button><button class="filter">Deutsch</button></div><div class="books">'+texts.map(t=>'<article class="book"><div class="cover">'+t.icon+'</div><div class="lang">'+t.lang+'</div><h3>'+t.title+'</h3><p>'+t.desc+'</p><button class="open" data-id="'+t.id+'">読み始める →</button></article>').join('')+'</div>';document.querySelectorAll('.open').forEach(b=>b.onclick=()=>reader(texts.find(t=>t.id===b.dataset.id)));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');const q=b.textContent.toLowerCase();document.querySelectorAll('.book').forEach((x,i)=>x.style.display=q==='すべて'||texts[i].lang.toLowerCase().includes(q)?'flex':'none')})}
function tokenize(s,t){if(t.lang==='日本語')return s;return s.split(/(\s+|[,.“”"!?¿¡])/).map(w=>/^\s+$|^[,.“”"!?¿¡]$/.test(w)?w:'<button class="word" data-word="'+w.replace(/"/g,'&quot;')+'">'+w+'</button>').join('')}
function reader(t){current=t;crumb.textContent='教材ライブラリ　/　'+t.title;const saved=localStorage.getItem('mn-reader-'+t.id);view.innerHTML='<button class="backlink" id="back">← ライブラリへ戻る</button><div class="reader"><article class="reader-main" id="reader"><div class="reader-meta"><span>'+t.lang+' · ORIGINAL STUDY EDITION</span><span>3 / 3</span></div><h2>'+t.title+'</h2>'+(saved||t.body.map(x=>'<p>'+tokenize(x,t)+'</p>').join(''))+'</article><aside class="study"><div class="definition" id="definition"><div class="placeholder">いまはメモモードです。右上の「メモモード」を押して単語モードに切り替えると、単語の意味を調べられます。</div></div><div class="cardbox"><h3>単語帳で復習</h3><p>気になった単語は、タップひとつで保存。あとからカード形式で復習できます。</p><button class="cards-btn" id="goCards">単語帳を開く →</button></div><div class="hint"><i>!</i><span>文の一部をドラッグして選ぶと、その場所の上に直接メモを置けます。</span></div></aside></div>';document.querySelector('#back').onclick=library;document.querySelector('#goCards').onclick=cardsView;bindReader()}
function applyMode(){document.body.classList.toggle('memo-mode',memoMode);const b=document.querySelector('#modeToggle');b.textContent=memoMode?'✎ メモモード':'辞 単語モード'}function bindReader(){applyMode();const r=document.querySelector('#reader');r.querySelectorAll('.word').forEach(b=>b.onclick=e=>{if(memoMode)return;e.stopPropagation();define(b.dataset.word)});r.addEventListener('mouseup',()=>setTimeout(()=>{const s=getSelection();if(!s||s.isCollapsed||!r.contains(s.anchorNode)||!r.contains(s.focusNode)){selection.style.display='none';return}range=s.getRangeAt(0);const box=range.getBoundingClientRect();selection.style.cssText='display:block;left:'+Math.max(8,box.left)+'px;top:'+(box.top-42)+'px'},0));r.addEventListener('click',e=>{const x=e.target.closest('.annot');if(x&&!e.target.closest('.word')&&confirm('このメモを削除しますか？')){x.replaceWith(x.textContent);saveReader()}})}
function define(w){const key=w.toLowerCase(),meaning=current.dict[key]||current.dict[w]||'この学習テキストの語彙です。意味を自分で調べ、単語帳にメモとして残せます。';const already=cards().some(c=>c.word.toLowerCase()===key&&c.lang===current.lang);document.querySelector('#definition').innerHTML='<div class="wordtitle">'+w+'</div><div class="language">'+current.lang+'</div><div class="meaning">'+meaning+'</div><button class="addword" id="addword">'+(already?'✓ 単語帳に追加済み':'＋ 単語帳に追加')+'</button>';document.querySelector('#addword').onclick=()=>{if(!already){setCards([{word:w,meaning,lang:current.lang},...cards()]);define(w)}}}
function saveReader(){localStorage.setItem('mn-reader-'+current.id,[...document.querySelectorAll('#reader p')].map(p=>p.outerHTML).join(''))}
document.querySelector('#noteButton').onclick=()=>{picked.textContent=range.toString();selection.style.display='none';modal.classList.add('show');noteText.focus()};document.querySelector('#cancel').onclick=()=>{modal.classList.remove('show');range=null};document.querySelector('#saveNote').onclick=()=>{const n=noteText.value.trim();if(!n||!range)return;try{const x=document.createElement('span');x.className='annot has-note';x.dataset.note=n;range.surroundContents(x);noteText.value='';modal.classList.remove('show');getSelection().removeAllRanges();saveReader()}catch(e){alert('ひとつの単語または短い範囲を選択してメモしてください。')}range=null};document.addEventListener('mousedown',e=>{if(!selection.contains(e.target)&&!e.target.closest('#reader'))selection.style.display='none'});
function cardsView(){current=null;crumb.textContent='わたしの単語帳';const a=cards();view.innerHTML='<button class="backlink" id="back">← ライブラリへ戻る</button><div class="heading"><div><div class="eyebrow">SPACED REVIEW</div><h1>わたしの単語帳</h1></div><div class="count">'+a.length+' 語を保存中</div></div>'+(a.length?'<section class="definition flash" id="flash"><div class="language" id="flang">'+a[0].lang+'</div><div class="front" id="fword">'+a[0].word+'</div><div class="back" id="fmeaning">'+a[0].meaning+'</div><div class="review-actions"><button class="cancel" id="flip">意味を見る</button><button class="again" id="remove">覚えたので外す</button><button class="good" id="next">次のカード →</button></div></section>':'<div class="definition"><div class="placeholder">まだ単語帳は空です。教材を読み、気になる単語をタップして追加してください。</div></div>');document.querySelector('#back').onclick=library;if(a.length){let i=0;const show=()=>{const c=cards();if(!c.length)return cardsView();i%=c.length;document.querySelector('#flang').textContent=c[i].lang;document.querySelector('#fword').textContent=c[i].word;document.querySelector('#fmeaning').textContent=c[i].meaning;document.querySelector('#flash').classList.remove('show')};document.querySelector('#flip').onclick=()=>document.querySelector('#flash').classList.toggle('show');document.querySelector('#next').onclick=()=>{i++;show()};document.querySelector('#remove').onclick=()=>{const c=cards();c.splice(i,1);setCards(c);show()}}}
document.querySelector('#modeToggle').onclick=()=>{memoMode=!memoMode;applyMode()};document.querySelector('#libraryNav').onclick=library;document.querySelector('#cardsNav').onclick=cardsView;document.querySelector('#cardsTop').onclick=cardsView;setCards(cards());library();
</script></body></html>
