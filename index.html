<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarginNote — 多言語で読む、ことばを育てる</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Serif+JP:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
:root{--ink:#1d2820;--muted:#68766d;--paper:#f8f7f0;--card:#fffefa;--green:#286044;--deep:#183727;--lime:#d9ed99;--yellow:#fff0a7;--line:#e3e7dc;--peach:#f7c37b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans","Hiragino Sans",sans-serif}button{font:inherit;border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--deep);color:#eaf1e9;padding:25px 17px;position:relative}.logo{font-size:22px;font-weight:700;letter-spacing:-1px;padding:0 10px}.logo b{color:var(--lime)}.tagline{font:11px/1.6 "Noto Serif JP",serif;color:#acc2af;padding:4px 10px}.nav{margin-top:35px;display:grid;gap:4px}.nav button{padding:11px;color:#c6d6c7;background:transparent;text-align:left;border-radius:8px;font-size:13px}.nav button.active,.nav button:hover{background:#355443;color:white}.side-label{margin:33px 10px 9px;color:#a9b9aa;font:10px "DM Mono";letter-spacing:.1em}.policy{padding:13px;background:#294837;border-radius:9px;color:#c5d7c6;font:11px/1.65 "Noto Serif JP",serif}.policy b{color:var(--lime)}.profile{position:absolute;bottom:26px;left:27px;font-size:12px;color:#c7d6c8}.top{height:74px;background:#fcfbf7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px}.crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}.pill{padding:9px 12px;background:#edf1e8;border-radius:8px;font-size:12px;color:#405247;font-weight:600}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--peach);font-size:12px;font-weight:700}.page{width:min(1120px,calc(100% - 66px));margin:39px auto}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.eyebrow{font:10px "DM Mono";letter-spacing:.12em;color:var(--green)}h1{font:600 29px/1.45 "Noto Serif JP",serif;margin:7px 0 0;letter-spacing:-1px}.count{font-size:12px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{padding:8px 13px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--muted);font-size:12px}.filter.active{background:var(--green);border-color:var(--green);color:white}.books{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.book{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px;min-height:208px;display:flex;flex-direction:column;transition:.15s}.book:hover{transform:translateY(-3px);box-shadow:0 12px 25px #18372710}.cover{width:39px;height:39px;display:grid;place-items:center;border-radius:9px;background:var(--lime);font-size:19px}.lang{font:10px "DM Mono";color:var(--green);margin:18px 0 7px;letter-spacing:.06em}.book h3{font:600 18px/1.5 "Noto Serif JP",serif;margin:0}.book p{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0}.open{margin-top:auto;align-self:flex-start;background:var(--green);color:white;border-radius:7px;padding:9px 11px;font-size:12px;font-weight:700}.reader{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:25px}.reader-main{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:40px 10%;box-shadow:0 8px 25px #18372708}.reader-meta{display:flex;justify-content:space-between;font:10px "DM Mono";color:#7f8a80;margin-bottom:22px}.reader-main h2{font:600 27px/1.55 "Noto Serif JP",serif;margin:0 0 27px}.reader-main p{font:17px/2.25 Georgia,"Noto Serif JP",serif;margin:0 0 20px;color:#343d35}.word{display:inline;background:transparent;padding:0;color:inherit;font:inherit;border-radius:3px}.word:hover{background:var(--yellow);color:#16492f}.annot{position:relative;background:linear-gradient(transparent 56%,var(--lime) 56%);cursor:pointer}.annot.has-note:before{content:attr(data-note);position:absolute;bottom:calc(100% + 9px);left:0;z-index:3;width:max-content;max-width:230px;padding:7px 10px;border-radius:8px;background:#2d503c;color:#f4f8ea;font:12px/1.6 "Noto Serif JP",serif;box-shadow:0 7px 18px #1630213b}.annot.has-note:after{content:"";position:absolute;bottom:calc(100% + 3px);left:12px;border:6px solid transparent;border-top-color:#2d503c}.study{position:sticky;top:20px}.definition,.cardbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:13px}.definition .placeholder{font:12px/1.7 "Noto Serif JP",serif;color:var(--muted)}.definition .wordtitle{font:600 25px Georgia,serif}.definition .language{font:10px "DM Mono";color:var(--green);margin:5px 0 13px}.meaning{font:13px/1.75 "Noto Serif JP",serif}.addword{margin-top:13px;padding:9px 11px;border-radius:7px;background:var(--green);color:white;font-size:12px;font-weight:700}.cardbox h3{font-size:13px;margin:0 0 7px}.cardbox p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 10px}.cards-btn{background:#eef3e9;color:#345643;border-radius:7px;padding:8px 10px;font-size:12px;font-weight:700}.hint{margin-top:15px;display:flex;gap:9px;font-size:11px;line-height:1.6;color:var(--muted)}.hint i{background:var(--lime);width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#264b35;font-style:normal;font-weight:bold}.selection{position:fixed;z-index:5;display:none;background:var(--deep);color:#fff;border-radius:8px;box-shadow:0 9px 20px #18372740}.selection button{background:transparent;color:white;padding:8px 10px;font-size:12px;font-weight:700}.modal{position:fixed;z-index:10;display:none;inset:0;place-items:center;background:#18372755;padding:18px}.modal.show{display:grid}.dialog{width:min(460px,100%);background:white;border-radius:15px;padding:24px;box-shadow:0 18px 50px #18372750}.dialog h3{font:600 18px "Noto Serif JP",serif;margin:15px 0}.selected{background:#f0f5c8;border-radius:6px;padding:9px;font:13px/1.6 "Noto Serif JP",serif}.dialog textarea{width:100%;height:108px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical;font:13px/1.6 "Noto Serif JP",serif}.dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.cancel{background:#edf0ea;border-radius:7px;padding:9px 12px}.save{background:var(--green);color:white;border-radius:7px;padding:9px 13px;font-weight:700}.flash{min-height:250px;display:grid;place-items:center;text-align:center}.flash .front{font:600 32px Georgia,serif}.flash .back{font:15px/1.8 "Noto Serif JP",serif;margin-top:20px;display:none}.flash.show .back{display:block}.review-actions{display:flex;gap:8px;justify-content:center;margin-top:22px}.again{padding:9px 15px;border-radius:7px;background:#fbe1d0;color:#80431e}.good{padding:9px 15px;border-radius:7px;background:var(--green);color:white}.backlink{margin-bottom:18px;padding:0;background:transparent;color:var(--green);font-size:13px;font-weight:700}@media(max-width:880px){.app{grid-template-columns:1fr}.side{display:none}.page{width:calc(100% - 32px);margin:27px auto}.top{padding:0 18px}.books{grid-template-columns:1fr}.reader{grid-template-columns:1fr}.study{position:static}.reader-main{padding:30px 8%}.reader-main p{font-size:16px}}</style></head>
<body><div class="app"><aside class="side"><div class="logo">Margin<b>Note</b></div><div class="tagline">読む。調べる。余白に残す。</div><nav class="nav"><button class="active" id="libraryNav">▣　教材ライブラリ</button><button id="cardsNav">▤　わたしの単語帳</button></nav><div class="side-label">COPYRIGHT SAFE</div><div class="policy"><b>収録テキストについて</b><br>パブリックドメイン童話に着想を得た、オリジナル学習用テキストだけを収録しています。</div><div class="profile">●　Haruka's study space</div></aside><main><header class="top"><div class="crumb" id="crumb">ライブラリ　/　多言語で読む</div><div class="top-actions"><button class="pill" id="cardsTop">単語帳 <span id="cardCount">0</span></button><div class="avatar">H</div></div></header><div class="page" id="view"></div></main></div><div class="selection" id="selection"><button id="noteButton">＋ この箇所にメモ</button></div><div class="modal" id="modal"><div class="dialog"><div class="selected" id="picked"></div><h3>文章の上にメモを置く</h3><textarea id="noteText" placeholder="気づきや自分の訳を書きましょう"></textarea><footer><button class="cancel" id="cancel">キャンセル</button><button class="save" id="saveNote">保存する</button></footer></div></div>
<script>
const texts=[
{id:'en',lang:'ENGLISH',icon:'☘',title:'The Tortoise and the Hare',desc:'Public-domain fable · Beginner',body:['A hare laughed at a slow tortoise. “You can never win a race,” he said. The tortoise looked at him and smiled.', 'They chose a long road through the forest. The hare ran quickly and soon could not see the tortoise behind him. “I have plenty of time,” he thought, and he lay down under a tree.', 'The tortoise walked slowly, but she did not stop. Step by step, she reached the finish line before the hare woke up.'],dict:{hare:'野うさぎ',tortoise:'カメ',race:'競走・レース',slow:'遅い',forest:'森',finish:'終点・ゴール',quickly:'すばやく',plenty:'たくさん',thought:'思った',reached:'到着した'}},
{id:'es',lang:'ESPAÑOL',icon:'☀',title:'La tortuga y la liebre',desc:'Adaptación original · Principiante',body:['Una liebre rápida se rió de una tortuga tranquila. “Nunca puedes ganar una carrera”, dijo la liebre.', 'La tortuga caminó por el bosque sin parar. La liebre corrió muy rápido, pero decidió descansar bajo un árbol.', 'Al final, la tortuga llegó primero. La liebre aprendió que la paciencia también puede ser fuerte.'],dict:{liebre:'野うさぎ',tortuga:'カメ',rápida:'速い',carrera:'競走',bosque:'森',descansar:'休む',primero:'最初に',paciencia:'忍耐'}},
{id:'fr',lang:'FRANÇAIS',icon:'✦',title:'Le petit jardin',desc:'Original learning tale · Débutant',body:['Mila trouve une petite graine dans son jardin. Elle la plante près de la fenêtre et lui donne de l’eau chaque matin.', 'Un jour, une fleur jaune ouvre ses pétales. Mila appelle son ami et ils regardent la fleur dans la lumière.', '“Les petites choses grandissent aussi”, dit Mila avec un sourire.'],dict:{graine:'種',jardin:'庭',plante:'植える',fenêtre:'窓',fleur:'花',jaune:'黄色い',ami:'友だち',lumière:'光',sourire:'笑顔'}},
{id:'de',lang:'DEUTSCH',icon:'❋',title:'Der kleine Stern',desc:'Original learning tale · Anfänger',body:['Ein kleiner Stern sieht jede Nacht auf ein stilles Dorf. Er möchte den Menschen helfen, ihren Weg nach Hause zu finden.', 'In einer dunklen Nacht leuchtet der Stern besonders hell. Ein Kind sieht das Licht und findet den Weg.', 'Der kleine Stern ist glücklich. Auch ein kleines Licht kann wichtig sein.'],dict:{Stern:'星',Nacht:'夜',Dorf:'村',Menschen:'人々',helfen:'助ける',Weg:'道',dunklen:'暗い',hell:'明るい',Kind:'子ども',wichtig:'大切な'}}
];let current=null,range=null;const view=document.querySelector('#view'),crumb=document.querySelector('#crumb'),selection=document.querySelector('#selection'),modal=document.querySelector('#modal'),noteText=document.querySelector('#noteText'),picked=document.querySelector('#picked');
const cards=()=>JSON.parse(localStorage.getItem('mn-cards')||'[]');function setCards(a){localStorage.setItem('mn-cards',JSON.stringify(a));document.querySelectorAll('#cardCount').forEach(x=>x.textContent=a.length)}
function library(){current=null;crumb.textContent='ライブラリ　/　多言語で読む';view.innerHTML='<div class="heading"><div><div class="eyebrow">COPYRIGHT-SAFE LANGUAGE LIBRARY</div><h1>童話を読みながら、ことばを自分のものに。</h1></div><div class="count">4つのオリジナル教材</div></div><div class="filters"><button class="filter active">すべて</button><button class="filter">English</button><button class="filter">Español</button><button class="filter">Français</button><button class="filter">Deutsch</button></div><div class="books">'+texts.map(t=>'<article class="book"><div class="cover">'+t.icon+'</div><div class="lang">'+t.lang+'</div><h3>'+t.title+'</h3><p>'+t.desc+'</p><button class="open" data-id="'+t.id+'">読み始める →</button></article>').join('')+'</div>';document.querySelectorAll('.open').forEach(b=>b.onclick=()=>reader(texts.find(t=>t.id===b.dataset.id)));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');const q=b.textContent.toLowerCase();document.querySelectorAll('.book').forEach((x,i)=>x.style.display=q==='すべて'||texts[i].lang.toLowerCase().includes(q)?'flex':'none')})}
function tokenize(s,t){return s.split(/(\s+|[,.“”"!?¿¡])/).map(w=>/^\s+$|^[,.“”"!?¿¡]$/.test(w)?w:'<button class="word" data-word="'+w.replace(/"/g,'&quot;')+'">'+w+'</button>').join('')}
function reader(t){current=t;crumb.textContent='教材ライブラリ　/　'+t.title;const saved=localStorage.getItem('mn-reader-'+t.id);view.innerHTML='<button class="backlink" id="back">← ライブラリへ戻る</button><div class="reader"><article class="reader-main" id="reader"><div class="reader-meta"><span>'+t.lang+' · ORIGINAL STUDY EDITION</span><span>3 / 3</span></div><h2>'+t.title+'</h2>'+(saved||t.body.map(x=>'<p>'+tokenize(x,t)+'</p>').join(''))+'</article><aside class="study"><div class="definition" id="definition"><div class="placeholder">単語をタップすると、意味と単語帳への追加がここに表示されます。</div></div><div class="cardbox"><h3>単語帳で復習</h3><p>気になった単語は、タップひとつで保存。あとからカード形式で復習できます。</p><button class="cards-btn" id="goCards">単語帳を開く →</button></div><div class="hint"><i>!</i><span>文の一部をドラッグして選ぶと、その場所の上に直接メモを置けます。</span></div></aside></div>';document.querySelector('#back').onclick=library;document.querySelector('#goCards').onclick=cardsView;bindReader()}
function bindReader(){const r=document.querySelector('#reader');r.querySelectorAll('.word').forEach(b=>b.onclick=e=>{e.stopPropagation();define(b.dataset.word)});r.addEventListener('mouseup',()=>setTimeout(()=>{const s=getSelection();if(!s||s.isCollapsed||!r.contains(s.anchorNode)||!r.contains(s.focusNode)){selection.style.display='none';return}range=s.getRangeAt(0);const box=range.getBoundingClientRect();selection.style.cssText='display:block;left:'+Math.max(8,box.left)+'px;top:'+(box.top-42)+'px'},0));r.addEventListener('click',e=>{const x=e.target.closest('.annot');if(x&&!e.target.closest('.word')&&confirm('このメモを削除しますか？')){x.replaceWith(x.textContent);saveReader()}})}
function define(w){const key=w.toLowerCase(),meaning=current.dict[key]||current.dict[w]||'この学習テキストの語彙です。意味を自分で調べ、単語帳にメモとして残せます。';const already=cards().some(c=>c.word.toLowerCase()===key&&c.lang===current.lang);document.querySelector('#definition').innerHTML='<div class="wordtitle">'+w+'</div><div class="language">'+current.lang+'</div><div class="meaning">'+meaning+'</div><button class="addword" id="addword">'+(already?'✓ 単語帳に追加済み':'＋ 単語帳に追加')+'</button>';document.querySelector('#addword').onclick=()=>{if(!already){setCards([{word:w,meaning,lang:current.lang},...cards()]);define(w)}}}
function saveReader(){localStorage.setItem('mn-reader-'+current.id,[...document.querySelectorAll('#reader p')].map(p=>p.outerHTML).join(''))}
document.querySelector('#noteButton').onclick=()=>{picked.textContent=range.toString();selection.style.display='none';modal.classList.add('show');noteText.focus()};document.querySelector('#cancel').onclick=()=>{modal.classList.remove('show');range=null};document.querySelector('#saveNote').onclick=()=>{const n=noteText.value.trim();if(!n||!range)return;try{const x=document.createElement('span');x.className='annot has-note';x.dataset.note=n;range.surroundContents(x);noteText.value='';modal.classList.remove('show');getSelection().removeAllRanges();saveReader()}catch(e){alert('ひとつの単語または短い範囲を選択してメモしてください。')}range=null};document.addEventListener('mousedown',e=>{if(!selection.contains(e.target)&&!e.target.closest('#reader'))selection.style.display='none'});
function cardsView(){current=null;crumb.textContent='わたしの単語帳';const a=cards();view.innerHTML='<button class="backlink" id="back">← ライブラリへ戻る</button><div class="heading"><div><div class="eyebrow">SPACED REVIEW</div><h1>わたしの単語帳</h1></div><div class="count">'+a.length+' 語を保存中</div></div>'+(a.length?'<section class="definition flash" id="flash"><div class="language" id="flang">'+a[0].lang+'</div><div class="front" id="fword">'+a[0].word+'</div><div class="back" id="fmeaning">'+a[0].meaning+'</div><div class="review-actions"><button class="cancel" id="flip">意味を見る</button><button class="again" id="remove">覚えたので外す</button><button class="good" id="next">次のカード →</button></div></section>':'<div class="definition"><div class="placeholder">まだ単語帳は空です。教材を読み、気になる単語をタップして追加してください。</div></div>');document.querySelector('#back').onclick=library;if(a.length){let i=0;const show=()=>{const c=cards();if(!c.length)return cardsView();i%=c.length;document.querySelector('#flang').textContent=c[i].lang;document.querySelector('#fword').textContent=c[i].word;document.querySelector('#fmeaning').textContent=c[i].meaning;document.querySelector('#flash').classList.remove('show')};document.querySelector('#flip').onclick=()=>document.querySelector('#flash').classList.toggle('show');document.querySelector('#next').onclick=()=>{i++;show()};document.querySelector('#remove').onclick=()=>{const c=cards();c.splice(i,1);setCards(c);show()}}}
document.querySelector('#libraryNav').onclick=library;document.querySelector('#cardsNav').onclick=cardsView;document.querySelector('#cardsTop').onclick=cardsView;setCards(cards());library();
</script></body></html>
